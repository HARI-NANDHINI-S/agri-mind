<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Expense - AgriMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#cbffc2",
                    "on-surface-variant": "#40493d",
                    "inverse-on-surface": "#eaf1ff",
                    "inverse-primary": "#88d982",
                    "on-primary-fixed": "#002204",
                    "on-error": "#ffffff",
                    "on-primary-fixed-variant": "#005312",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed": "#a3f69c",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#dee9fc",
                    "surface-bright": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#d9e3f6",
                    "secondary": "#126d27",
                    "tertiary-container": "#4b7850",
                    "surface-container": "#e6eeff",
                    "background": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#88d982",
                    "outline": "#707a6c",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#83da85",
                    "on-tertiary-fixed": "#002109",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#19722b",
                    "surface": "#f8f9ff",
                    "on-tertiary-fixed-variant": "#24502c",
                    "secondary-fixed": "#9ff79f",
                    "surface-variant": "#d9e3f6",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#9cf49c",
                    "primary": "#0d631b",
                    "on-secondary-fixed": "#002105",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#bfcaba",
                    "surface-tint": "#1b6d24",
                    "primary-container": "#2e7d32",
                    "tertiary-fixed": "#bdefbe",
                    "on-secondary-fixed-variant": "#005318",
                    "tertiary": "#335f3a",
                    "surface-dim": "#d0dbed",
                    "on-tertiary-container": "#ccfecd",
                    "inverse-surface": "#27313f",
                    "on-background": "#121c2a",
                    "tertiary-fixed-dim": "#a2d3a4",
                    "on-surface": "#121c2a"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "md": "16px",
                    "margin": "24px",
                    "xs": "4px",
                    "sm": "8px",
                    "xl": "32px",
                    "gutter": "20px",
                    "2xl": "48px",
                    "lg": "24px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "code-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["22px", {"lineHeight": "30px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "code-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]

          }
        }
      }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .tap-highlight-transparent {
                -webkit-tap-highlight-color: transparent;
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen">
<!-- Top Navigation (Transactional, no shell navs per instructions) -->
<header class="fixed top-0 left-0 w-full z-40 bg-surface border-b border-outline-variant flex items-center justify-between px-lg h-16">
<button class="text-primary font-label-md text-label-md px-sm py-xs hover:bg-surface-container rounded-DEFAULT transition-colors">
            Cancel
        </button>
<h1 class="text-headline-md font-headline-md text-on-surface">Add Expense</h1>
<button class="bg-primary-container text-on-primary font-label-md text-label-md px-md py-sm rounded-DEFAULT hover:opacity-90 transition-opacity">
            Save
        </button>
</header>
<!-- Main Content Area -->
<main class="pt-24 pb-2xl px-margin md:px-xl max-w-3xl mx-auto">
<form class="space-y-lg bg-surface-container-lowest p-md md:p-lg rounded-xl border border-outline-variant shadow-sm">
<!-- Expense Title -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="expense_title">Expense Title</label>
<input class="w-full h-10 px-md border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="expense_title" placeholder="e.g., Tractor Maintenance" type="text"/>
</div>
<!-- Amount & Category Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Amount -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="amount">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-on-surface-variant">₹</span>
<input class="w-full h-10 pl-10 pr-md border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="amount" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Category -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="category">Category</label>
<div class="relative">
<select class="w-full h-10 px-md pr-10 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none transition-colors" id="category">
<option disabled="" selected="" value="">Select category</option>
<option value="seeds">Seeds</option>
<option value="fertilizer">Fertilizer</option>
<option value="labor">Labor</option>
<option value="fuel">Fuel / Machinery</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="date">Date</label>
<div class="relative">
<input class="w-full h-10 px-md border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="date" type="date"/>
</div>
</div>
<!-- Crop & Field Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Crop -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="crop">Crop (Optional)</label>
<div class="relative">
<select class="w-full h-10 px-md pr-10 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none transition-colors" id="crop">
<option disabled="" selected="" value="">Select crop</option>
<option value="wheat">Winter Wheat - 2024</option>
<option value="corn">Sweet Corn - 2024</option>
<option value="soybeans">Soybeans - 2024</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
<!-- Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="field">Field (Optional)</label>
<div class="relative">
<select class="w-full h-10 px-md pr-10 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none transition-colors" id="field">
<option disabled="" selected="" value="">Select field</option>
<option value="north_40">North 40 Acres</option>
<option value="river_block">River Block</option>
<option value="greenhouse_a">Greenhouse A</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="notes">Notes</label>
<textarea class="w-full p-md border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-y transition-colors" id="notes" placeholder="Add any additional details here..." rows="3"></textarea>
</div>
<!-- Attachment/Receipt -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Receipt / Attachment</label>
<div class="w-full border-2 border-dashed border-outline-variant rounded-lg p-lg flex flex-col items-center justify-center bg-surface-bright hover:bg-surface-container-low transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-3xl mb-sm" style="font-variation-settings: 'FILL' 0;">upload_file</span>
<p class="font-body-md text-on-surface-variant text-center">Click to upload or drag and drop<br/><span class="text-xs text-outline">PNG, JPG, PDF up to 10MB</span></p>
</div>
</div>
</form>
</main>
</body></html>
